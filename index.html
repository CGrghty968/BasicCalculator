<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>

</head>
<body>
    <h1>Basic Calculator</h1>

    <p>Enter two numbers </p>

    <!-- Adding the two input fields for the numbers -->
    <label for="n1">Number 1: </label>
    <input id="n1"><br>

    <label for="n2">Number 2: </label>
    <input id="n2"><br>

    <br>
    <!-- Div tag to contain all buttons together (group) -->
    <div>
        <button id="aBtn">Add</button>
        <button id="sBtn">Subtraction</button>
        <button id="mBtn">Multiplication</button>
        <button id="dBtn">Division</button>
        <button id="rBtn">Remainder</button>
    </div>

    <!-- empty p-tag to serve as a visual output to the calculation -->
    <p id="answer"></p>

    <!-- Script linked at end of the page to solve the error of button
     being null - The script is executed too quickly -->
    <script src="calculator.js"></script>
</body>
</html>
